<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#2563eb);color:white;min-height:100vh;display:grid;place-items:center;padding:20px}
.container{width:100%;max-width:650px;text-align:center}
h1{font-size:2.5rem}
.search{display:flex;gap:10px;justify-content:center}
input,button{padding:13px;border:0;border-radius:10px;font-size:16px}
input{width:65%;min-width:0}
button{background:#38bdf8;color:#082f49;font-weight:bold;cursor:pointer}
button:hover{background:#7dd3fc}
#weather{margin-top:25px}
.card{background:#ffffff18;border:1px solid #ffffff35;padding:25px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.metric{background:#ffffff15;padding:15px;border-radius:12px}
#error{color:#fecaca;margin-top:15px}
#loading{margin-top:15px}
@media(max-width:450px){.grid{grid-template-columns:1fr}h1{font-size:2rem}}
</style>
</head>
<body>
<main class="container">
<h1>🌤️ Weather Dashboard</h1>
<p>Get real-time weather updates for any city.</p>
<form class="search" id="searchForm">
<input id="city" placeholder="Enter city name" required>
<button type="submit">Search</button>
</form>
<p id="loading" hidden>Fetching weather...</p>
<p id="error" role="alert"></p>
<section id="weather" aria-live="polite"></section>
</main>
<script>
const form = document.getElementById("searchForm");
const cityInput = document.getElementById("city");
const weather = document.getElementById("weather");
const error = document.getElementById("error");
const loading = document.getElementById("loading");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const city = cityInput.value.trim();
  if (!city) return;

  error.textContent = "";
  weather.replaceChildren();
  loading.hidden = false;

  try {
    const geoResponse = await fetch(
      `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
    );
    if (!geoResponse.ok) throw new Error("Unable to search for this city.");

    const geoData = await geoResponse.json();
    if (!geoData.results?.length) throw new Error("City not found. Try another name.");

    const place = geoData.results[0];
    const params = new URLSearchParams({
      latitude: place.latitude,
      longitude: place.longitude,
      current: "temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m",
      timezone: "auto"
    });

    const response = await fetch(
      `https://api.open-meteo.com/v1/forecast?${params}`
    );
    if (!response.ok) throw new Error("Unable to fetch weather data.");

    const data = await response.json();
    const current = data.current;
    if (!current) throw new Error("Weather information is unavailable.");

    weather.innerHTML = `
      <div class="card">
        <h2>${escapeHTML(place.name)}, ${escapeHTML(place.country || "")}</h2>
        <h1>🌡️ ${current.temperature_2m}°C</h1>
        <p>Feels like ${current.apparent_temperature}°C</p>
        <div class="grid">
          <div class="metric">💧<br>Humidity<br><strong>${current.relative_humidity_2m}%</strong></div>
          <div class="metric">💨<br>Wind Speed<br><strong>${current.wind_speed_10m} km/h</strong></div>
          <div class="metric">🌡️<br>Temperature<br><strong>${current.temperature_2m}°C</strong></div>
        </div>
        <p>Updated: ${escapeHTML(current.time.replace("T", " "))}</p>
      </div>`;
  } catch (err) {
    error.textContent = err.message || "Something went wrong. Please try again.";
  } finally {
    loading.hidden = true;
  }
});

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[char]);
}
</script>
</body>
</html>
